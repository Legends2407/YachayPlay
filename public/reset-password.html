<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nueva contraseña - YachayPlay
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>


    <a
        href="login.html"
        class="btn-regresar-auth"
        aria-label="Volver"
    ></a>


    <div class="login-card">


        <h1>
            Nueva contraseña
        </h1>


        <form id="formReset">


            <input
                type="password"
                id="password"
                placeholder="Nueva contraseña"
            >


            <small
                class="mensaje-error-campo"
                id="errorPassword"
            ></small>


            <input
                type="password"
                id="confirmarPassword"
                placeholder="Confirmar contraseña"
            >


            <small
                class="mensaje-error-campo"
                id="errorConfirmar"
            ></small>


            <button type="submit">

                Cambiar contraseña

            </button>


        </form>


        <p
            id="mensajeReset"
            class="mensaje-recuperacion"
        ></p>


    </div>


    <script src="js/reset-password.js"></script>

</body>

</html>
