<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nueva contraseña - YachayPlay
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>


    <a
        href="login.html"
        class="btn-regresar-auth"
        aria-label="Volver"
    ></a>


    <div class="login-card">


        <h1>
            Nueva contraseña
        </h1>


        <form id="formReset">

        <!-- NUEVA CONTRASEÑA -->

        <div class="grupo-password">

            <label for="password">
                Contraseña nueva
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Escribe tu nueva contraseña"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="btn-ver-password"
                    onclick="alternarPassword('password', this)"
                    aria-label="Mostrar contraseña"
                >
                    👁️
                </button>

            </div>

            <small
                class="mensaje-error-campo"
                id="errorPassword"
            ></small>

        </div>


        <!-- CONFIRMAR CONTRASEÑA -->

        <div class="grupo-password">

            <label for="confirmarPassword">
                Confirmar contraseña
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmarPassword"
                    placeholder="Vuelve a escribir la contraseña"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="btn-ver-password"
                    onclick="alternarPassword('confirmarPassword', this)"
                    aria-label="Mostrar contraseña"
                >
                    👁️
                </button>

            </div>

            <small
                class="mensaje-error-campo"
                id="errorConfirmar"
            ></small>

        </div>


        <button
            type="submit"
            id="btnCambiarPassword"
        >
            Cambiar contraseña
        </button>

    </form>


        <p
            id="mensajeReset"
            class="mensaje-recuperacion"
        ></p>


    </div>


    <script src="js/reset-password.js"></script>

</body>

</html>
