<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar Sesión - YachayPlay
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>

</head>

<body>


    <!-- FLECHA REGRESAR -->

    <a
        href="index.html"
        class="btn-regresar-auth"
        title="Volver al inicio"
        aria-label="Volver al inicio"
    ></a>


    <!-- LOGIN -->

    <div class="login-card">


        <img
            src="assets/condor-login.png"
            class="condor-login"
            alt="Cóndor YachayPlay"
        >


        <h1>
            Iniciar Sesión
        </h1>


        <form
            id="formLogin"
            novalidate
        >


            <!-- CORREO -->

            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                autocomplete="username"
                required
            >


            <small
                class="mensaje-error-campo"
                id="errorCorreo"
            ></small>



            <!-- CONTRASEÑA -->

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                autocomplete="off"
                required
            >


            <small
                class="mensaje-error-campo"
                id="errorPassword"
            ></small>

            <div class="olvido-password">
                <a href="forgot-password.html">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <!-- INGRESAR -->

            <button type="submit">

                Ingresar

            </button>



            <!-- GOOGLE -->

            <div id="googleBtnDiv"></div>


        </form>


        <p>

            ¿No tienes cuenta?

            <a href="registro.html">
                Regístrate
            </a>

        </p>


    </div>


    <script src="js/login.js"></script>


</body>

</html>
