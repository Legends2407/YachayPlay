<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recuperar contraseña - YachayPlay
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>


    <a
        href="login.html"
        class="btn-regresar-auth"
        title="Volver al login"
        aria-label="Volver al login"
    ></a>


    <div class="login-card">


        <img
            src="assets/condor-login.png"
            class="condor-login"
            alt="Cóndor YachayPlay"
        >


        <h1>
            Recuperar contraseña
        </h1>


        <p class="texto-recuperacion">

            Escribe el correo con el que
            te registraste en YachayPlay.

        </p>


        <form id="formRecuperar">


            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                autocomplete="email"
            >


            <small
                class="mensaje-error-campo"
                id="errorCorreo"
            ></small>


            <button type="submit">

                Enviar enlace

            </button>


        </form>


        <p
            id="mensajeRecuperacion"
            class="mensaje-recuperacion"
        ></p>


    </div>


    <script src="js/forgot-password.js"></script>

</body>

</html>
